{{define "camera-login"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera · Puppy Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {{template "styles" .}}
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-xs mx-auto px-6">
        <p class="text-sm font-semibold text-stone-700 mb-6 text-center">Camera Access</p>
        {{if .Error}}
        <p class="text-xs text-rose-500 mb-3 text-center">Incorrect token — try again</p>
        {{end}}
        <form method="POST" action="/camera" class="space-y-3">
            <input type="password" name="token" placeholder="Access token" autofocus
                class="w-full rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 text-sm focus:outline-none focus:border-stone-400 focus:bg-white transition-colors">
            <button type="submit"
                class="w-full py-3 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 active:bg-indigo-800 transition-colors select-none">
                Unlock
            </button>
        </form>
    </div>
</body>
</html>
{{end}}


{{define "camera-page"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera · Puppy Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {{template "styles" .}}
</head>
<body class="bg-stone-950 min-h-screen">
    <div class="max-w-md mx-auto px-4 pt-6 pb-24">
        <img id="stream" src="/camera/stream" class="w-full rounded-xl" alt="">
        <p id="offline" class="hidden text-center text-stone-500 text-sm mt-6">Camera offline — retrying…</p>
    </div>
    {{template "nav" "camera"}}
    <script>
    var img = document.getElementById('stream');
    var offline = document.getElementById('offline');
    img.onerror = function() {
        offline.classList.remove('hidden');
        setTimeout(function() {
            img.src = '/camera/stream?t=' + Date.now();
        }, 5000);
    };
    img.onload = function() { offline.classList.add('hidden'); };
    </script>
</body>
</html>
{{end}}
