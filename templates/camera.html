{{define "camera-login"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera · Puppy Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {{template "styles" .}}
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-xs mx-auto px-6">
        <p class="text-sm font-semibold text-stone-700 mb-6 text-center">Camera Access</p>
        {{if .Error}}
        <p class="text-xs text-rose-500 mb-3 text-center">Incorrect token — try again</p>
        {{end}}
        <form method="POST" action="/camera" class="space-y-3">
            <input type="password" name="token" placeholder="Access token" autofocus
                class="w-full rounded-xl border border-stone-200 bg-stone-50 px-4 py-3 text-sm focus:outline-none focus:border-stone-400 focus:bg-white transition-colors">
            <button type="submit"
                class="w-full py-3 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700 active:bg-indigo-800 transition-colors select-none">
                Unlock
            </button>
        </form>
    </div>
</body>
</html>
{{end}}


{{define "camera-page"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camera · Puppy Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    {{template "styles" .}}
</head>
<!--
  Layout (all fixed, no scroll):
    ┌─────────────────────────┐  ← top: 0
    │                         │
    │         video           │  flex center
    │                         │
    ├─────────────────────────┤  ← bottom: nav-h + 44px
    │  🔇  [Pen] [Crate]      │  44px controls bar
    ├─────────────────────────┤  ← bottom: nav-h
    │         nav             │  nav-h = 56px + safe-area-inset-bottom
    └─────────────────────────┘  ← bottom: 0
-->
<body class="bg-stone-950 overflow-hidden" style="height:100dvh;">

    <!-- Video area: fills space above controls -->
    <div id="video-wrap"
         class="fixed inset-x-0 top-0 overflow-hidden bg-black flex items-center justify-center"
         style="bottom:calc(env(safe-area-inset-bottom,0px) + 100px);">
        <!--
          Before rotation: wide element (177.78vw × 100vw), landscape 16:9.
          After rotate(90deg): visual size is 100vw wide × 177.78vw tall — portrait.
          overflow:hidden on parent clips whatever extends beyond the available height.
        -->
        <video id="stream"
               style="width:177.78vw;height:100vw;flex-shrink:0;transform:rotate(90deg);"
               autoplay muted playsinline></video>
        <div id="loading" class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="w-8 h-8 rounded-full border-2 border-stone-600 border-t-stone-400 animate-spin"></div>
        </div>
        <div id="offline" class="hidden absolute inset-0 flex items-center justify-center pointer-events-none">
            <p class="text-stone-500 text-sm">Camera offline — retrying…</p>
        </div>
    </div>

    <!-- Controls: fixed bar sitting above the nav -->
    <div class="fixed inset-x-0 flex items-center gap-3 px-4 bg-stone-950 z-30"
         style="bottom:calc(env(safe-area-inset-bottom,0px) + 56px);height:44px;">
        <button id="mute-btn" onclick="toggleMute()"
            class="px-3 py-1.5 rounded-lg bg-stone-800 text-stone-400 text-xs font-medium select-none">
            🔇 Sound off
        </button>
        <div class="flex gap-2 ml-auto">
            <button id="btn-pen" onclick="loadCamera('pen')"
                class="px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white select-none">Pen</button>
            <button id="btn-crate" onclick="loadCamera('crate')"
                class="px-3 py-1.5 rounded-lg text-xs font-medium bg-stone-800 text-stone-400 select-none">Crate</button>
        </div>
    </div>

    {{template "nav" "camera"}}

    <script>
    var video   = document.getElementById('stream');
    var offline = document.getElementById('offline');
    var loading = document.getElementById('loading');
    var muteBtn = document.getElementById('mute-btn');
    var hls;
    var currentCamera = 'pen';
    var retryTimer;
    var stallTimer;
    var mediaErrCount = 0;
    var hasPlayed = false;

    function log(msg) {
        console.log('[camera ' + currentCamera + '] ' + new Date().toISOString().slice(11,23) + ' ' + msg);
    }

    // Only activate the stall watchdog after the video has played at least once.
    // Firing before first play creates an infinite reload loop during initial buffering.
    video.addEventListener('waiting', function() {
        if (!hasPlayed) return;
        log('waiting for data');
        clearTimeout(stallTimer);
        stallTimer = setTimeout(function() {
            if (!video.paused && document.visibilityState === 'visible') {
                log('stall timeout — reloading');
                loadCamera(currentCamera);
            }
        }, 8000);
    });
    video.addEventListener('playing', function() {
        hasPlayed = true;
        clearTimeout(stallTimer);
        loading.classList.add('hidden');
        log('playing');
    });

    function loadCamera(id) {
        currentCamera = id;
        clearTimeout(retryTimer);
        clearTimeout(stallTimer);
        mediaErrCount = 0;
        hasPlayed = false;

        ['pen', 'crate'].forEach(function(cam) {
            var btn = document.getElementById('btn-' + cam);
            btn.className = 'px-3 py-1.5 rounded-lg text-xs font-medium select-none ' +
                (cam === id ? 'bg-indigo-600 text-white' : 'bg-stone-800 text-stone-400');
        });

        offline.classList.add('hidden');
        loading.classList.remove('hidden');
        if (hls) { hls.destroy(); hls = null; }

        log('loading ' + id);
        var src = '/camera/' + id + '/hls/stream.m3u8';

        if (Hls.isSupported()) {
            hls = new Hls({
                maxBufferLength: 4,         // small buffer — less stale content to catch up on
                liveSyncDurationCount: 2,   // stay ~2 s behind live
                liveMaxLatencyDurationCount: 6, // if >6 s behind, seek to live edge
            });
            hls.loadSource(src);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
            hls.on(Hls.Events.FRAG_LOADED, function(event, data) {
                var s = data.frag.stats;
                var loadMs = s ? Math.round(s.loading.end - s.loading.start) : '?';
                var sizeKB = s ? Math.round(s.total / 1024) : '?';
                log('frag sn=' + data.frag.sn + ' load=' + loadMs + 'ms size=' + sizeKB + 'KB');
            });
            hls.on(Hls.Events.ERROR, function(event, data) {
                if (!data.fatal) {
                    log('non-fatal ' + data.type + '/' + data.details);
                    return;
                }
                log('fatal ' + data.type + '/' + data.details);
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    hls.startLoad();
                    return;
                }
                if (data.type === Hls.ErrorTypes.MEDIA_ERROR && mediaErrCount < 2) {
                    mediaErrCount++;
                    hls.recoverMediaError();
                    return;
                }
                mediaErrCount = 0;
                loading.classList.add('hidden');
                offline.classList.remove('hidden');
                retryTimer = setTimeout(function() { loadCamera(currentCamera); }, 5000);
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = src;
            video.addEventListener('error', function onErr() {
                loading.classList.add('hidden');
                offline.classList.remove('hidden');
                retryTimer = setTimeout(function() { loadCamera(currentCamera); }, 5000);
                video.removeEventListener('error', onErr);
            }, { once: true });
            video.play();
        }
    }

    function toggleMute() {
        video.muted = !video.muted;
        muteBtn.textContent = video.muted ? '🔇 Sound off' : '🔊 Sound on';
    }

    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') { loadCamera(currentCamera); }
    });
    window.addEventListener('pageshow', function(e) {
        if (e.persisted) { loadCamera(currentCamera); }
    });

    // Pick the camera that currently has presence; fall back to pen.
    Promise.all(['pen', 'crate'].map(function(id) {
        return fetch('/api/camera/' + id + '/presence')
            .then(function(r) { return r.json(); })
            .then(function(d) { return { id: id, active: d.present && !d.stale }; })
            .catch(function() { return { id: id, active: false }; });
    })).then(function(results) {
        var active = results.find(function(r) { return r.active; });
        loadCamera(active ? active.id : 'pen');
    });
    </script>
</body>
</html>
{{end}}
